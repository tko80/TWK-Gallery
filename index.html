<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TWK Gallery"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TWK Gallery</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div><div class="eyebrow">YOUR MOMENTS</div><h1>Gallery</h1><p id="count">0 items</p></div>
  <button class="round" id="addBtn" aria-label="Add photos">＋</button>
  <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
</header>
<div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Search photos, videos or albums"></div>
<nav class="tabs" id="tabs">
  <button class="tab active" data-view="all">All</button><button class="tab" data-view="photos">Photos</button><button class="tab" data-view="videos">Videos</button><button class="tab" data-view="favorites">♥</button><button class="tab" data-view="albums">Albums</button>
</nav>
<main>
  <section id="albumTools" class="album-tools" hidden><button class="pill" id="newAlbum">＋ New album</button></section>
  <section class="manage-tools"><button class="pill" id="selectBtn">Select</button><button class="pill" id="sortBtn">Newest first</button></section>
  <section id="selectionBar" class="selection-bar" hidden><span id="selectedCount">Selected items</span><button class="pill" id="selectAll">Select all</button><button class="pill" id="moveSelected">Move to album</button><button class="pill" id="deleteSelected">Remove</button><button class="pill" id="clearSelection">Done</button></section>
  <section id="grid" class="grid" aria-live="polite"></section>
  <section id="empty" class="empty"><div class="empty-icon">▧</div><h2>Your gallery starts here</h2><p>Add photos and videos from your iPhone to build your private gallery.</p><button class="primary" id="emptyAdd">Choose photos</button></section>
</main>
<footer><span>TWK GALLERY</span><span id="storageNote">Stored on this device</span></footer>
<div class="viewer" id="viewer" hidden>
  <div class="viewer-head"><button class="round ghost" id="closeViewer">×</button><div id="viewerInfo"></div><span><button class="round ghost small" id="prevBtn">‹</button><button class="round ghost small" id="nextBtn">›</button></span></div>
  <div class="viewer-stage" id="viewerStage"></div>
  <div class="viewer-actions"><button id="favoriteBtn">♡ Favorite</button><button id="shareBtn">↗ Share</button><button id="deleteBtn" class="danger">⌫ Remove</button></div>
</div>
<div class="modal" id="modal" hidden><div class="modal-card"><h2 id="modalTitle">New album</h2><input id="albumName" maxlength="40" placeholder="Album name"><div class="modal-actions"><button id="cancelModal" class="pill">Cancel</button><button id="saveAlbum" class="primary">Create</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
